workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Patch livekit_client null-safety bug
        script: |
          LIVEKIT_LOCAL=$(find $HOME/.pub-cache/hosted/pub.dev -name "local.dart" -path "*/livekit_client*/participant/local.dart" | head -1)
          if [ -n "$LIVEKIT_LOCAL" ]; then
            echo "Patching $LIVEKIT_LOCAL"
            sed -i '' 's/publishOptions\.videoCodec/publishOptions!.videoCodec/g' "$LIVEKIT_LOCAL"
            sed -i '' 's/publishOptions\.degradationPreference/publishOptions!.degradationPreference/g' "$LIVEKIT_LOCAL"
            echo "Patch applied"
          else
            echo "livekit local.dart not found, skipping patch"
          fi

      - name: Generate plugin registrant
        script: |
          flutter precache --ios
          cd ios
          flutter pub get --no-pub

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS simulator (xcodebuild, no signing)
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            EXCLUDED_ARCHS=arm64 \
            build \
            -derivedDataPath ../build/ios

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/Runner.app

    publishing:
      email:
        recipients:
          - pandeyeklavya35@gmail.com
        notify:
          success: true
          failure: true
