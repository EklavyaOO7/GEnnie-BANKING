workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install --repo-update

      - name: Generate Flutter build files
        script: |
          flutter build ios --simulator --debug --no-pub 2>&1 || true

      - name: Build with xcodebuild (simulator, no signing)
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            EXCLUDED_ARCHS=arm64 \
            build \
            -derivedDataPath ../build/ios

    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/Runner.app

    publishing:
      email:
        recipients:
          - pandeyeklavya35@gmail.com
        notify:
          success: true
          failure: true
